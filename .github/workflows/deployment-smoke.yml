name: Deployment smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed Render origin, without a trailing slash
        required: true
        default: https://motif-piano-generator.onrender.com

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install smoke-test dependency
        run: python -m pip install pretty-midi==0.2.11.post0
      - name: Wake and test v2 generation
        run: >-
          python -m scripts.smoke_test_deployment
          --base-url "${{ inputs.base_url }}"
          --wake-timeout 240
          --request-timeout 120
